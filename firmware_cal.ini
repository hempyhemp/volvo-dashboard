; Калибровки ЭБУ, привязанные к КОНКРЕТНОЙ прошивке.
;
; Этот файл читает tools/fw_cal/gen_fw_cal.py при каждой сборке и делает из
; него include/firmware_cal.h. Заголовок руками не правь — правь этот файл.
;
; ЗАЧЕМ. Дашборд считает давление и расход по числам, которые живут в
; прошивке ЭБУ. Поменяешь прошивку в блоке — числа поедут, а дашборд молча
; начнёт врать. Чтобы этого не было, здесь записана контрольная сумма той
; прошивки, на которой калибровки снимались. При сборке она сверяется с
; реальным .bin в корне: не совпало — громкое предупреждение в сборке и
; сообщение в Serial при старте платы.
;
; ЧТО ДЕЛАТЬ, ЕСЛИ ПОМЕНЯЛ ПРОШИВКУ:
;   1. положи новый .bin в корень (имя укажи ниже в file=);
;   2. собери один раз — сборка напечатает новую sha256 и предупреждение;
;   3. перепроверь значения ниже в своём редакторе калибровок;
;   4. впиши новые значения и новую sha256 сюда.

[firmware]
; Имя файла прошивки в корне репозитория.
file = J5TRS251_VOLVO_ORIG.bin
; Контрольная сумма прошивки, ПОД КОТОРУЮ сняты калибровки ниже.
sha256 = 3ed58955b63c37f677740dcb1f8ee8bf5d3673d2cbce3fa3d5c24ec9df7b8af8

; Имя прошивки, дата, номера ЭБУ и ЧИСЛО ЦИЛИНДРОВ здесь писать НЕ надо —
; они лежат в самом .bin машиночитаемо и вытаскиваются автоматически
; (блок идентификации, маркер "Cil:N").

[dad]
; ДАД — датчик абсолютного давления. Значения из редактора калибровок.
; Наклон рабочей формулы давления привязан к span_kpa: если поставишь ДАД
; с другим диапазоном, наклон отмасштабируется сам.
;
; ВНИМАНИЕ: сама формула давления в прошивке (12.5 + 241*raw/255) на машине
; НЕ подтвердилась — занижала на 5.6 кПа на атмосфере. Рабочий закон
; ЗАМЕРЕН по ИОН (docs/KLINE.md, «ЭТАЛОН ИОН»). Эти числа нужны как опора
; для масштабирования, а не как готовая формула.
min_kpa = 12.5
span_kpa = 241.0

[engine]
; Цилиндровый объём, см3. Число цилиндров берётся из прошивки.
cyl_volume_cm3 = 575
; Запасное значение на случай, если в прошивке не нашёлся маркер "Cil:N".
cylinders = 4

[fuel]
; Стехиометрический состав смеси. Обогащение под наддувом замерено по ИОН
; и задаётся в src/kline_test.cpp (KLINE_AFR_BOOST).
afr_stoich = 14.7

[afr_map]
; Карта «Состав смеси от давления» — читается ПРЯМО ИЗ ПРОШИВКИ.
; Найдена 2026-09-19, см. docs/KLINE.md, раздел «КАРТА СОСТАВА СМЕСИ».
; Место подтверждено независимо: чужой тюнинг из 2volvo.bin отличается от
; нашей прошивки ровно внутри этой карты.
;   AFR = (байт + bias) * afr_full / 256
; Генератор проверяет, что расшифрованные значения лежат в 9..16, и если
; нет — считает, что смещение уехало, и карту не выдаёт.
offset = 0x76EF
; горизонталь (столбцы) — обороты коленвала
cols = 16
; вертикаль (строки) — абсолютное давление
rows = 16
bias = 128
afr_full = 14.7

; --- ОСИ КАРТЫ ---
; В самом .bin оси найти не удалось: перебраны байтовые кодировки (единственно
; возможный делитель 40 — НОД всех значений), 16-битные прямые и обратные, с
; реверсом порядка, плюс поиск «по форме» монотонного окна с теми же
; отношениями. Совпадений ноль. Значит оси, как и калибровки ДАД, лежат в
; описании редактора, а не отдельной таблицей в прошивке — поэтому сюда.
;
; Обороты коленвала, об/мин — ось СТОЛБЦОВ (горизонталь).
; Снято со скриншота ЧипТюнерPRO «Состав смеси от давления» 2026-09-19.
rpm_axis = 600, 800, 1000, 1200, 1600, 2000, 2520, 3000, 3520, 4000, 4520, 5000, 5520, 6000, 7000, 10200

; Абсолютное давление, кПа — ось СТРОК (вертикаль).
; ПОКА НЕ ЗАПОЛНЕНО: в выгрузке .cte осей нет, на скриншоте видна только ось
; оборотов. Без неё индексировать карту по давлению нечем, поэтому расход
; по-прежнему считается по прямой из двух точек (KLINE_AFR_* в kline_test.cpp).
; Как появится — вписать 16 значений, и карта заработает.
kpa_axis =
