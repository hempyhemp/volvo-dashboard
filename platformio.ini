; PlatformIO Project Configuration File
;
; Board: TENSTAR ROBOT ESP32-2432S028 ("Cheap Yellow Display", CYD)
; MCU:   ESP32 (обычный, не C3)
; TFT:   ILI9341, 320x240, SPI
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-2432S028]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ 9.5.0
; Версия lvgl совпадает с той, что используется в PC-симуляторе (pc-sim/lib/lvgl) —
; экран из lib/ui_demo одинаково собирается в обоих проектах.
;
; U8g2_for_TFT_eSPI (кириллица через прямой вывод в TFT_eSPI) больше не
; используется: экраном теперь полностью управляет LVGL, а прямой вывод
; поверх него будет затираться при каждой перерисовке. Кириллица под LVGL
; потребует своего кастомного шрифта (встроенные шрифты LVGL — тоже
; только ASCII) — это отдельная следующая задача.

; --------------------------------------------------------------------
; Конфигурация TFT_eSPI задаётся здесь, через build_flags, а не через
; редактирование User_Setup.h внутри библиотеки. Это правильный способ
; для PlatformIO: настройки не потеряются при переустановке библиотеки
; и явно видны все используемые GPIO, как и требовалось в задаче.
; --------------------------------------------------------------------
build_flags =
    ; lv_conf.h лежит в include/ (стандартный include-путь PlatformIO),
    ; а не рядом с папкой библиотеки lvgl — говорим LVGL искать его так.
    -DLV_CONF_INCLUDE_SIMPLE=1
    ; Файлы шрифтов, сгенерированные lv_font_conv, делают #include "lvgl.h"
    ; напрямую (а не "lvgl/lvgl.h") только если задан этот макрос.
    -DLV_LVGL_H_INCLUDE_SIMPLE=1

    -DUSER_SETUP_LOADED=1
    ; Обычный ILI9341_DRIVER давал "шум" на части экрана в альбомной
    ; ориентации (rotation=1/3) — типичный признак клона контроллера с
    ; иной обработкой адресации GRAM при развороте. ILI9341_2_DRIVER —
    ; штатный альтернативный драйвер TFT_eSPI именно для таких клонов
    ; (см. https://github.com/Bodmer/TFT_eSPI/issues/1172).
    -DILI9341_2_DRIVER=1

    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    ; SPI шина дисплея (общая с тач-контроллером XPT2046, у которого свой CS)
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH

    ; Шрифты, используемые в проекте
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
